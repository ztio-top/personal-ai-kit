[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ==========================================
# 显式声明打包路径，解决 src-layout 自动发现失败的问题
# ==========================================
[tool.hatch.build.targets.wheel]
packages = ["src/ai_kit"]

[project]
name = "personal-ai-kit"
version = "0.2.0"
description = "Personal AI toolkit featuring PromptOps compiler and PEOS RAG engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.26.0", "pyyaml>=6.0.3", "requests>=2.31.0"]

[project.scripts]
peos-doctor = "ai_kit.governance.cli:main"
promptops = "ai_kit.prompt_engine.cli:main"
peos-ask = "ai_kit.rag_engine.cli:main"
